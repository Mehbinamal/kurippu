[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurippu"
version = "0.1.0"
description = "Turn WhatsApp grocery orders into bills with a local open-weight model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "rapidfuzz>=3", "qrcode[pil]>=7.4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kurippu = "kurippu.app:main"

[tool.setuptools]
packages = ["kurippu"]

[tool.setuptools.package-data]
kurippu = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
